# PostgreSQL Configuration for Small Server (up to 100 users)
# This file should be placed in: /etc/postgresql/14/main/conf.d/
# Or added to postgresql.conf

# ==============================================================================
# CONNECTION SETTINGS
# ==============================================================================

# Docker Compose services connect to PostgreSQL through the container network.
# Keep external exposure controlled at the Compose/firewall layer; the postgres
# service does not publish port 5432 by default.
listen_addresses = '*'

# Reduce max connections for small server
max_connections = 50                    # Default: 100 (we only need 50)

# ==============================================================================
# MEMORY SETTINGS
# ==============================================================================

# Shared memory for caching
shared_buffers = 256MB                  # Default: 128MB (increase for better caching)

# Effective cache (should be ~50% of total RAM)
effective_cache_size = 1GB              # Adjust based on server RAM

# Work memory for sorts and hash tables (per operation)
work_mem = 4MB                          # Default: 4MB (sufficient for small queries)

# Maintenance work memory (for VACUUM, CREATE INDEX)
maintenance_work_mem = 64MB             # Default: 64MB

# ==============================================================================
# WRITE AHEAD LOG (WAL)
# ==============================================================================

# Minimal WAL if no replication needed
wal_level = minimal                     # Default: replica (use minimal if no replication)

# No replication for small server
max_wal_senders = 0                     # Default: 10 (0 if no replication)

# ==============================================================================
# QUERY TUNING
# ==============================================================================

# Random page cost (lower for SSD)
random_page_cost = 1.1                  # Default: 4.0 (set to 1.1 for SSD)

# Effective IO concurrency (for SSD)
effective_io_concurrency = 200          # Default: 1 (set to 200 for SSD)

# ==============================================================================
# LOGGING
# ==============================================================================

# Log slow queries only (> 1 second)
log_min_duration_statement = 1000       # Log queries taking more than 1 second

# Reduce logging verbosity
log_line_prefix = '%m [%p] %u@%d '      # Timestamp, PID, user, database

# Only log errors and warnings
log_min_messages = warning              # Default: warning

# ==============================================================================
# AUTOVACUUM (Automatic cleanup)
# ==============================================================================

autovacuum = on                         # Default: on (keep enabled)
autovacuum_max_workers = 2              # Default: 3 (reduce to 2 for small server)

# ==============================================================================
# STATISTICS
# ==============================================================================

# Track query statistics (useful for monitoring)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# ==============================================================================
# CLIENT CONNECTION DEFAULTS
# ==============================================================================

# Timezone
timezone = 'UTC'

# Encoding
client_encoding = utf8

# ==============================================================================
# NOTES
# ==============================================================================

# Apply changes:
# sudo systemctl restart postgresql

# Verify configuration:
# sudo -u postgres psql -c "SHOW max_connections;"
# sudo -u postgres psql -c "SHOW shared_buffers;"

# Monitor connections:
# SELECT count(*) FROM pg_stat_activity;
