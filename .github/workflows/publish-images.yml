# Exported to .github/workflows/publish-images.yml in the server repository.
# Each repository publishes tagged images to its own GHCR package.
name: Publish server images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Build and publish ICE Config Service
        uses: docker/build-push-action@v7
        with:
          context: ./ice_config_service
          file: ./ice_config_service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-ice-config-service:${{ github.ref_name }}

  # Users install versions listed on the Releases page, so a release must not
  # appear before its images. This creates only a draft: the publisher checks
  # anonymous image pulls, completes the notes, and publishes it.
  release-draft:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      SERVER_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      ICE_IMAGE: ghcr.io/${{ github.repository }}-ice-config-service:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create draft release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          # Database changes are listed from the repository, not written by hand. They are
          # counted from the last published release: candidate tags without a release do
          # not reach servers, so their migrations are new for every owner.
          PREVIOUS_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            MIGRATIONS="$(git diff --name-only --diff-filter=A "$PREVIOUS_TAG" "$TAG" -- server/db/migrations \
              | grep -E '\.sql$' | xargs -r -n1 basename | sed 's/^/- `/; s/$/`/')"
            SINCE="since $PREVIOUS_TAG"
          else
            MIGRATIONS=""
            SINCE=""
          fi
          if [ -n "$MIGRATIONS" ]; then
            DATABASE="New migrations $SINCE run automatically during the update:

          $MIGRATIONS

          After them, the previous version may not start on this database. To go back, restore the backup made before updating."
          elif [ -n "$PREVIOUS_TAG" ]; then
            DATABASE="No database changes $SINCE."
          else
            DATABASE="First release: the database is created during installation."
          fi
          cat > notes.md <<NOTES
          ## Changes

          <!-- Publisher: what changed for server owners and their users; mark security fixes. Comments are not shown on the release page. -->

          <!-- Publisher: add "## Before updating" only if the update needs more than the README "Updating" steps: a new setting or secret, a configuration change, app versions that stop working with this server (CLIENT_SERVER_COMPATIBILITY.md). -->

          ## Database

          $DATABASE

          ## Images

          - \`$SERVER_IMAGE\`
          - \`$ICE_IMAGE\`

          Install or update by following the README with \`CIRCLUS_IMAGE_TAG=$TAG\`.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file notes.md
