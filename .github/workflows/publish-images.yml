# Exported to .github/workflows/publish-images.yml in the server repository.
# Each repository publishes tagged images to its own GHCR package.
name: Publish server images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Build and publish ICE Config Service
        uses: docker/build-push-action@v7
        with:
          context: ./ice_config_service
          file: ./ice_config_service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-ice-config-service:${{ github.ref_name }}

  # Users install versions listed on the Releases page, so a release must not
  # appear before its images. This creates only a draft: the publisher checks
  # anonymous image pulls, completes the notes, and publishes it.
  release-draft:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      SERVER_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      ICE_IMAGE: ghcr.io/${{ github.repository }}-ice-config-service:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create draft release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          python3 deploy/generate-release-notes.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file notes.md
